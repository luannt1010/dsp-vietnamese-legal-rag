[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-legal-rag"
version = "0.1.0"
description = "Shared contracts and retrieval implementations for Vietnamese legal RAG"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10,<3", "PyYAML>=6.0.2,<7", "rank-bm25>=0.2.2,<0.3",
    "requests>=2.32,<3", "numpy>=2,<3", "tokenizers>=0.22,<1",
    "huggingface-hub>=0.34,<2", "onnxruntime>=1.22,<2",
    "psycopg[binary,pool]>=3.2,<4", "pgvector>=0.3,<1", "neo4j>=5.26,<7",
    "python-docx>=1.1,<2", "PyMuPDF>=1.25,<2", "beautifulsoup4>=4.12,<5",
    "python-dotenv>=1.0,<2",
    "pyarrow>=18,<25",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
reranking = ["sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
include = ["core*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
